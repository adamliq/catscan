<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FortiGate, FSSO &amp; FortiManager Log Specification</title>
<style>
:root{
  --bg:#EEF1F3;--surface:#FFFFFF;--sunk:#E6EAED;--ink:#18212B;--muted:#56616D;--rule:#CBD2D8;
  --syslog:#1C7A70;--syslog-bg:#DDF0EC;--local:#5A4AA6;--local-bg:#E7E4F6;--disk:#4F5964;--disk-bg:#E3E7EA;
  --crit:#B02A1F;--high:#C25A17;--med:#8E7410;--low:#63717E;--accent:#1D4E89;--accent-bg:#DCE7F5;--on-accent:#FFFFFF;
  --sans:"Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:58px;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161C;--surface:#18212A;--sunk:#141C24;--ink:#E6EBEF;--muted:#9AA6B1;--rule:#2D3945;
  --syslog:#5CC4B6;--syslog-bg:#12312E;--local:#A99BF0;--local-bg:#251F45;--disk:#A6B0BA;--disk-bg:#232D36;
  --crit:#F0786C;--high:#F29A5C;--med:#D9BE4F;--low:#9AA8B4;--accent:#7FB0F0;--accent-bg:#1A2C44;--on-accent:#0E1620;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C;--surface:#18212A;--sunk:#141C24;--ink:#E6EBEF;--muted:#9AA6B1;--rule:#2D3945;
  --syslog:#5CC4B6;--syslog-bg:#12312E;--local:#A99BF0;--local-bg:#251F45;--disk:#A6B0BA;--disk-bg:#232D36;
  --crit:#F0786C;--high:#F29A5C;--med:#D9BE4F;--low:#9AA8B4;--accent:#7FB0F0;--accent-bg:#1A2C44;--on-accent:#0E1620;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 12px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.55}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.mono{font-family:var(--mono);font-size:.86em;overflow-wrap:anywhere}
h1,h2,h3,h4{line-height:1.2;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--rule);height:var(--hdr)}
.hdr .in{max-width:1440px;margin:0 auto;height:100%;display:flex;align-items:center;gap:14px;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--mono);font-size:.72rem}
.brand small{font-weight:400;color:var(--muted);font-size:.85rem}
.srch{position:relative;flex:1;max-width:520px;margin-left:auto}
.srch input{width:100%;font:inherit;font-size:.95rem;padding:8px 12px 8px 34px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);color:var(--ink)}
.srch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.srch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.72rem;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:min(70vh,520px);overflow:auto;z-index:70;padding:6px}
.sres a{display:block;padding:8px 10px;border-radius:7px;text-decoration:none;color:var(--ink)}
.sres a.on,.sres a:hover{background:var(--accent-bg)}
.sres .k{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-right:8px}
.sres .s{display:block;font-size:.84rem;color:var(--muted)}
.sres .none{padding:10px;color:var(--muted);font-size:.92rem}
.btn.menu{display:none}
main:focus{outline:none}
@media (max-width:980px){.btn.menu{display:inline-flex}.brand small{display:none}.srch kbd{display:none}}
@media (max-width:560px){.brand span.t{display:none}#theme .full{display:none}}
#theme .short{display:none}@media (max-width:560px){#theme .short{display:inline}}

/* layout */
.layout{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:262px minmax(0,1fr)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr));height:calc(100vh - var(--hdr) - env(safe-area-inset-top,0px));overflow:auto;padding:22px 14px 40px 20px;border-right:1px solid var(--rule)}
.side h5{margin:18px 0 6px;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.side h5:first-child{margin-top:0}
.side a{display:block;text-decoration:none;color:var(--ink);padding:6px 10px;border-radius:7px;font-size:.95rem}
.side a:hover{background:var(--sunk)}
.side a[aria-current="page"]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.side .poc{margin-top:24px;font-size:.82rem;color:var(--muted);padding:0 10px}
main{min-width:0;padding:34px 44px 80px;overflow-wrap:break-word}
.page{max-width:1080px}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:80;top:0;left:0;bottom:0;width:min(300px,86vw);height:auto;background:var(--surface);transform:translateX(-102%);transition:transform .2s;padding-top:calc(env(safe-area-inset-top,0px) + 20px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim{position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.35)}
  main{padding:26px 18px 70px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* typography */
.crumb{font-size:.88rem;color:var(--muted);margin:0 0 .6rem}
.crumb a{color:var(--muted)}
.page>h1{font-size:clamp(1.8rem,3.6vw,2.6rem);letter-spacing:-.01em;margin-bottom:.5rem}
.lede{color:var(--muted);max-width:72ch;margin:0 0 1.6rem;font-size:1.06rem}
.page h2{font-size:1.45rem;margin:2.6rem 0 .5rem}
.page h3{font-size:1.12rem;margin:1.8rem 0 .6rem}
.page p{max-width:76ch}
.sub{color:var(--muted);max-width:72ch;margin:-.2rem 0 1rem;font-size:.95rem}
ul.plain,ol.plain{padding-left:1.3rem;max-width:76ch}.plain li{margin-bottom:.45rem}
.note{border-left:3px solid var(--accent);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;margin:1rem 0;max-width:80ch;font-size:.95rem}
.note.warn{border-left-color:var(--high)}
.idtag{font-family:var(--mono);font-size:.8rem;color:var(--muted);background:var(--sunk);border-radius:5px;padding:2px 7px}

/* controls */
.btn{font:inherit;font-size:.92rem;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:7px;padding:7px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.sm{font-size:.82rem;padding:4px 10px}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 1rem}
.filters input[type=search]{font:inherit;font-size:.95rem;padding:7px 12px;border:1px solid var(--rule);border-radius:7px;background:var(--surface);color:var(--ink);min-width:min(260px,100%)}
.filters .lab{font-size:.85rem;color:var(--muted);margin-right:2px}
.fsep{width:1px;height:24px;background:var(--rule);margin:0 4px}

/* tags */
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.syslog{background:var(--syslog-bg);color:var(--syslog)}
.tag.local{background:var(--local-bg);color:var(--local)}
.tag.disk{background:var(--disk-bg);color:var(--disk)}
.tag.neutral{background:var(--sunk);color:var(--muted)}
.lvl{font-weight:700;font-size:.84rem;text-transform:capitalize}
.lvl.critical{color:var(--crit)}.lvl.high{color:var(--high)}.lvl.medium{color:var(--med)}.lvl.low{color:var(--low)}
.dchip{display:inline-block;font-family:var(--mono);font-size:.76rem;padding:2px 7px;margin:0 4px 4px 0;border-radius:5px;border:1px solid var(--rule);color:var(--accent);text-decoration:none;background:transparent;cursor:pointer}
.dchip:hover{border-color:var(--accent)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;margin:0 0 1rem}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.82rem;background:var(--surface)}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:var(--accent-bg)}
td.path,.path{font-family:var(--mono);font-size:.8rem;overflow-wrap:anywhere}
td.ck,th.ck{text-align:center;white-space:nowrap}
td.ck{color:var(--syslog);font-weight:700}td.no{color:var(--muted);font-weight:400}
.empty-row{padding:16px;color:var(--muted)}

/* code */
.block{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0 0 1rem}
.block header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule)}
.block header h4{font-size:.92rem;font-weight:700}
.block pre{margin:0;padding:13px 15px;overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.block>p{margin:0;padding:10px 14px;border-top:1px solid var(--rule);font-size:.86rem;color:var(--muted);max-width:none}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

/* cards */
.card{display:block;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 16px;text-decoration:none;color:var(--ink)}
a.card:hover{border-color:var(--accent)}
.card h3{margin:0 0 .35rem;font-size:1.05rem}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.9rem}

/* spec */
.spec{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0 0 1rem}
.spec dt,.spec dd{padding:10px 14px;border-bottom:1px solid var(--rule);margin:0}
.spec dt{color:var(--muted);font-size:.88rem;background:var(--sunk)}
.spec dd{font-size:.93rem;overflow-wrap:anywhere}
.spec dt:last-of-type,.spec dd:last-of-type{border-bottom:none}
@media (max-width:640px){.spec{grid-template-columns:minmax(0,1fr)}.spec dt{border-bottom:none;padding-bottom:2px}}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:2.5rem;padding-top:1.2rem;border-top:1px solid var(--rule);flex-wrap:wrap}
.pn a{text-decoration:none;max-width:48%}
.pn small{display:block;color:var(--muted)}
.comp{display:inline-flex;gap:4px}
.comp span{font-family:var(--mono);font-size:.72rem;width:20px;height:20px;display:grid;place-items:center;border-radius:4px;background:var(--sunk);color:var(--muted)}
.comp span.y{background:var(--accent-bg);color:var(--accent);font-weight:700}

/* chain */
.chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.stage{display:flex;flex-direction:column;position:relative;background:var(--surface);border:1px solid var(--rule);border-left:none;padding:15px 16px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.stage:first-child{border-left:1px solid var(--rule);border-radius:10px 0 0 10px}
.stage:last-child{border-radius:0 10px 10px 0}
.stage::after{content:"";position:absolute;right:-9px;top:50%;width:16px;height:16px;background:var(--surface);border-top:1px solid var(--rule);border-right:1px solid var(--rule);transform:translateY(-50%) rotate(45deg);z-index:1}
.stage:last-child::after{display:none}
.stage:hover,.stage:hover::after{background:var(--accent-bg)}
.stage strong{font-size:1rem;margin-bottom:.3rem}
.stage .d{font-size:.86rem;color:var(--muted)}
.stage .ft{margin-top:auto;padding-top:.7rem;font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.stage .ft b{display:block;color:var(--accent);font-weight:500}
@media (max-width:900px){
  .chain{grid-template-columns:minmax(0,1fr)}
  .stage,.stage:first-child,.stage:last-child{border:1px solid var(--rule);border-top:none;border-radius:0}
  .stage:first-child{border-top:1px solid var(--rule);border-radius:10px 10px 0 0}
  .stage:last-child{border-radius:0 0 10px 10px}
  .stage::after{right:auto;left:26px;top:auto;bottom:-9px;transform:rotate(135deg)}
}

/* explorer */
.exhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin:0 0 1.1rem}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.86rem;color:var(--muted)}
.explorer{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.2fr);grid-template-rows:auto 1fr;grid-template-areas:"t d l" "x d l";column-gap:44px}
.ex-t{grid-area:t}.ex-d{grid-area:d}.ex-l{grid-area:l}
.explorer h4{font-size:.88rem;color:var(--muted);font-weight:400;margin-bottom:.5rem}
.list{display:flex;flex-direction:column;gap:5px}
.item{position:relative;z-index:2;display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:6px 9px;cursor:pointer;transition:opacity .15s}
.item:hover{border-color:var(--accent)}
.item .id{font-family:var(--mono);font-size:.74rem;color:var(--muted);min-width:2.5em}
.item .lv{width:4px;align-self:stretch;border-radius:2px;flex:none}
.item.syslog{background:var(--syslog-bg);border-color:transparent}
.item.local{background:var(--local-bg);border-color:transparent}
.item.disk{background:var(--disk-bg);border-color:transparent}
.item .p{font-family:var(--mono);font-size:.76rem;overflow-wrap:anywhere}
.item.dim{opacity:.22}.item.sel{outline:2px solid var(--accent);outline-offset:1px}.item.rel{border-color:var(--accent)}
.explorer.only .item.dim{display:none}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
#wires path{fill:none;stroke:var(--accent);stroke-width:1.4;opacity:.55}
.detail{grid-area:x;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 14px);margin-top:1.4rem;z-index:3;max-height:calc(100vh - var(--hdr) - 30px);overflow:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.detail .t{font-size:1.08rem;font-weight:700;margin:0 0 .3rem}
.detail .m{color:var(--muted);font-size:.88rem;margin:0 0 .6rem}
.detail p{font-size:.92rem;margin:.4rem 0}
.detail pre{margin:.6rem 0 0;background:var(--bg);border-radius:6px;padding:9px 11px;font-family:var(--mono);font-size:.76rem;white-space:pre-wrap;overflow-wrap:anywhere}
@media (max-width:900px){.explorer{grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"t" "d" "l" "x";row-gap:24px}#wires{display:none}.detail{position:static;margin-top:0;max-height:none}}

/* schema explorer */
.schema{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.schema{grid-template-columns:minmax(0,1fr);gap:18px}}
.slist{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 14px)}
@media (max-width:900px){.slist{position:static;flex-direction:row;flex-wrap:wrap}}
.slist .grp{font-size:.78rem;color:var(--muted);margin:.6rem 0 .1rem;text-transform:uppercase;letter-spacing:.05em}
.slist .grp:first-child{margin-top:0}
@media (max-width:900px){.slist .grp{width:100%}}
.sbtn{display:flex;align-items:center;gap:6px;text-align:left;font:inherit;font-size:.88rem;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:7px;padding:5px 9px;cursor:pointer;text-decoration:none}
.sbtn:hover{border-color:var(--rule)}
.sbtn[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.sbtn .sw{margin:0;flex:none}
@media (max-width:900px){.sbtn{border-color:var(--rule)}}
.smeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:.5rem 0 1rem;font-size:.88rem;color:var(--muted)}
.ssample{margin:0;font-family:var(--mono);font-size:.82rem;line-height:1.9;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:13px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
.ssample mark{background:transparent;color:inherit;border-bottom:2px solid var(--accent);padding:1px 0;border-radius:2px}
.ssample.plain mark{border-bottom-color:transparent}
.ssample mark.on{background:var(--accent);color:var(--on-accent);border-bottom-color:var(--accent)}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin:1.4rem 0 .6rem}
.shead h4{font-size:1rem}
.ftable tr.on td{background:var(--accent-bg)}
.ftable td:first-child{font-family:var(--mono);font-size:.8rem;white-space:nowrap}
.ftable .val{font-family:var(--mono);font-size:.78rem;overflow-wrap:anywhere;max-width:220px}
.ftable .ty{font-size:.8rem;color:var(--muted);white-space:nowrap}
@media (max-width:900px){
  .ftable thead{display:none}
  .ftable,.ftable tbody,.ftable tr,.ftable td{display:block;width:auto}
  .ftable tr{padding:11px 13px;border-bottom:1px solid var(--rule)}
  .ftable tr:last-child{border-bottom:none}
  .ftable td{border:none;padding:2px 0}
  .ftable td:nth-child(1),.ftable td:nth-child(2){display:inline-block;margin-right:10px}
  .ftable td:nth-child(1){font-weight:700}
  .ftable .val{max-width:none}
  .ftable td.val::before{content:"Sample: ";color:var(--muted);font-family:var(--sans)}
  .ftable td:empty{display:none}
  .ftable tr.on{background:var(--accent-bg)}.ftable tr.on td{background:transparent}
}

/* triage */
textarea{width:100%;min-height:150px;font-family:var(--mono);font-size:.82rem;line-height:1.5;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink);resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
.err{color:var(--crit);font-size:.9rem;margin:8px 0 0}
.res{margin-top:1.4rem;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.res{grid-template-columns:minmax(0,1fr)}}
.hit{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:0 10px 10px 0;padding:13px 15px;margin-bottom:10px}
.hit .h{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.hit p{margin:.3rem 0 .5rem;font-size:.9rem;color:var(--muted)}
.kv{align-self:start;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:13px 15px}
.kv dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;margin:0;font-size:.86rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-family:var(--mono);font-size:.8rem;overflow-wrap:anywhere}

details.smp summary{cursor:pointer;color:var(--accent);font-size:.86rem}
details.smp pre{margin:.5rem 0 0;background:var(--bg);border-radius:6px;padding:9px 11px;font-family:var(--mono);font-size:.76rem;white-space:pre-wrap;overflow-wrap:anywhere}

/* architecture diagrams */
.dg{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;margin:0 0 1.3rem;scroll-margin-top:calc(var(--hdr) + 16px)}
.dg figcaption{font-size:.86rem;color:var(--muted);margin-top:14px}
.nrow{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px}
.nd{border:1px solid var(--rule);border-radius:9px;padding:10px 12px;background:var(--bg);text-align:center;min-width:0}
.nd b{display:block;font-size:.95rem}.nd span{display:block;font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.nd.ctl{background:var(--accent-bg);border-color:var(--accent)}.nd.edge{background:var(--syslog-bg);border-color:var(--syslog)}
.nd.ext{border-style:dashed}.nd.fw{background:var(--disk-bg);border-color:var(--disk)}
.conn{display:flex;flex-direction:column;align-items:center;margin:4px 0;font-size:.8rem;color:var(--muted);text-align:center}
.conn::before{content:"";width:2px;height:16px;background:var(--accent)}
.conn::after{content:"";border:6px solid transparent;border-top-color:var(--accent);border-bottom:0}
.conn span:empty{display:none}.conn span{padding:2px 0}
.flow{display:flex;flex-direction:column;align-items:stretch;max-width:560px;margin:0 auto}
.hbar{margin-top:12px;border-top:2px solid var(--syslog);text-align:center;font-size:.8rem;color:var(--muted);padding-top:6px}
.lbls{font-size:.76rem;color:var(--muted);text-align:center;margin-top:6px}
.band{border-radius:9px;padding:12px 14px;margin-bottom:8px;border-left:4px solid;background:var(--bg)}
.band b{display:block}.band span{font-size:.88rem;color:var(--muted)}
.band.b1{border-color:var(--local)}.band.b2{border-color:var(--accent)}.band.b3{border-color:var(--syslog)}
.zone{border:1px dashed var(--rule);border-radius:10px;padding:11px 14px;background:var(--bg);text-align:center}
.zone b{display:block}.zone span{font-size:.84rem;color:var(--muted)}
.zone.z0{border-color:var(--crit)}.zone.z1{border-color:var(--high)}.zone.z2{border-color:var(--accent)}.zone.z3{border-color:var(--syslog)}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr);gap:10px;align-items:center}
.pair.up{font-size:.76rem;color:var(--muted);text-align:center;margin:8px 0}
.hlink{position:relative;text-align:center;font-size:.78rem;color:var(--muted)}
.hlink::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--syslog);z-index:0}
.hlink span{position:relative;background:var(--surface);padding:0 6px;display:inline-block}
@media (max-width:560px){.dg{padding:14px}.nrow{gap:6px}.nd{padding:8px 6px}.nd b{font-size:.84rem}.nd span{font-size:.72rem}}
@media print{
  .hdr,.side,.scrim,.filters,.btn,#wires,.pn{display:none!important}
  .layout{display:block}main{padding:0}body{background:#fff;color:#000}
  .detail,.slist{position:static}
}
</style>

<script>
const LOGS=[{"k": "forward", "id": "LS-01", "name": "Forward traffic and session outcomes", "scope": "FortiGate", "source": "FortiGate remote syslog / configured log target", "facility": "type=traffic; subtype=forward", "events": "Forward traffic and session outcomes", "fields": "srcip, dstip, srcport, dstport, proto, policyid, poluuid, sessionid, action, sentbyte, rcvdbyte, duration, user", "condition": "Requires policy logging plus a destination filter that includes forward traffic. Session end, start and periodic records must not be counted as independent sessions. logtraffic utm does not provide all-session coverage.", "verify": "show log syslogd setting\nshow log syslogd filter\nshow firewall policy", "refs": [1, 2, 3]}, {"k": "local", "id": "LS-02", "name": "Local-in and local-out traffic", "scope": "FortiGate", "source": "FortiGate remote syslog / local traffic view", "facility": "type=traffic; subtype=local", "events": "Local-in and local-out traffic", "fields": "srcip, dstip, srcport, dstport, policyid, policytype, action, service", "condition": "Traffic terminating on or originating from the appliance. Local-traffic forwarding and local traffic generation controls are separate; a forwarded traffic policy does not define local-in management access.", "verify": "show log setting\nshow log syslogd filter", "refs": [1, 2]}, {"k": "deny", "id": "LS-03", "name": "Explicit and implicit policy denials", "scope": "FortiGate", "source": "Traffic log stream", "facility": "traffic; normally forward or local", "events": "Explicit and implicit policy denials", "fields": "policyid, policytype, action, srcip, dstip, srcport, dstport, service", "condition": "Explicit deny policy logging and implicit-deny logging require separate review. policyid=0 alone is not a universal denial test. Use action and event context.", "verify": "show firewall policy\nshow full-configuration log setting", "refs": [1, 3]}, {"k": "ips", "id": "LS-04", "name": "Intrusion prevention", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; subtype=ips", "events": "Intrusion prevention", "fields": "attack, attackid, severity, action, srcip, dstip, policyid, sessionid, incidentserialno", "condition": "Requires an applied IPS sensor and relevant signature logging. An IPS alert is not proof of exploitation; action must distinguish detection from blocking.", "verify": "Review applied IPS sensors, policy and Security Events > Intrusion Prevention", "refs": [1, 4]}, {"k": "av", "id": "LS-05", "name": "Antivirus and malware", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; subtype=virus", "events": "Antivirus and malware", "fields": "virus, virusid, action, filename, filehash, srcip, dstip, service", "condition": "Requires AV inspection and logging. File/hash fields depend on event and inspection mode; encrypted traffic visibility depends on inspection configuration.", "verify": "Review antivirus profile and Antivirus logs", "refs": [1, 4]}, {"k": "web", "id": "LS-06", "name": "Web filtering", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; subtype=webfilter", "events": "Web filtering", "fields": "hostname, url, cat, catdesc, action, user, srcip, policyid, profile", "condition": "Profile logging and inspection determine allowed/blocked visibility. Do not infer full HTTPS path visibility from hostname alone.", "verify": "Review web filter profile and Web Filter logs", "refs": [1, 4]}, {"k": "dns", "id": "LS-07", "name": "DNS filtering", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; subtype=dns", "events": "DNS filtering", "fields": "qname, qtype, ipaddr, action, catdesc, srcip, policyid", "condition": "Requires DNS filter logging. DNS over HTTPS/TLS may not be visible as ordinary DNS; answer IP and query fields vary.", "verify": "Review DNS filter profile and DNS Query logs", "refs": [1, 4]}, {"k": "app", "id": "LS-08", "name": "Application control", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; subtype=app-ctrl", "events": "Application control", "fields": "appid, app, appcat, apprisk, action, srcip, dstip, sessionid", "condition": "Requires an applied application-control profile and its logging settings. Application risk and syslog level are different concepts.", "verify": "Review application list and Application Control logs", "refs": [1, 4]}, {"k": "dlp", "id": "LS-09", "name": "DLP, file and email filtering", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; subtypes dlp, file-filter, emailfilter as supported", "events": "DLP, file and email filtering", "fields": "action, filename, filetype, filesize, filteridx, rulename, sender, recipient, messageid", "condition": "Conditional on profile, inspection mode and version. DLP matches do not establish that data left the network; confirm action and traffic. Email metadata can be sensitive.", "verify": "Review enabled profiles and corresponding Security Events", "refs": [1, 4]}, {"k": "ssl", "id": "LS-10", "name": "SSL inspection and web application protection", "scope": "FortiGate", "source": "Security / UTM syslog", "facility": "type=utm; ssl / waf where supported", "events": "SSL inspection and web application protection", "fields": "action, hostname, profile, srcip, dstip, msg", "condition": "Only configured inspection and WAF features emit relevant events. Certificate inspection is not full TLS content inspection; treat bypasses as explicit coverage limits.", "verify": "Review SSL/SSH inspection and WAF profiles", "refs": [1, 4]}, {"k": "anomaly", "id": "LS-11", "name": "DoS and anomaly protection", "scope": "FortiGate", "source": "Security logs / anomaly view", "facility": "Anomaly log classification varies by release", "events": "DoS and anomaly protection", "fields": "attack, attackid, action, srcip, dstip, count, msg", "condition": "Requires a DoS policy or applicable anomaly engine. Some log taxonomies use a dedicated anomaly type; do not force every security log into type=utm.", "verify": "Review DoS policies and anomaly logs", "refs": [1, 4]}, {"k": "admin", "id": "LS-12", "name": "Firewall administrator access and API activity", "scope": "FortiGate", "source": "Event logs / remote syslog", "facility": "type=event; system and rest-api where supported", "events": "Firewall administrator access and API activity", "fields": "user, ui, srcip, action, status, reason, profile", "condition": "Collect successful and failed management authentication plus supported API audit. Do not assume complete request/response bodies or every read-only API call are logged.", "verify": "show log eventfilter\nReview System Events and administrator audit", "refs": [1, 4]}, {"k": "config", "id": "LS-13", "name": "Firewall configuration changes", "scope": "FortiGate", "source": "System event logs; configuration backups", "facility": "type=event; subtype=system", "events": "Firewall configuration changes", "fields": "user, ui, action, cfgpath, cfgobj, cfgattr, cfgtid", "condition": "Change detail depends on settings and release. Match changes to configuration revisions; FortiManager actor attribution may require manager-side audit.", "verify": "Review System Events, configuration revisions and configuration-change logging settings", "refs": [1, 4]}, {"k": "vpn", "id": "LS-14", "name": "VPN authentication and tunnel lifecycle", "scope": "FortiGate", "source": "VPN event logs; traffic logs", "facility": "type=event; subtype=vpn; related traffic", "events": "VPN authentication and tunnel lifecycle", "fields": "user, remip, locip, tunnelid, tunneltype, action, status, reason", "condition": "IPsec and supported SSL-VPN modes vary by model/release. Tunnel-up does not prove a specific application flow; join traffic records and AAA/IdP events.", "verify": "get vpn ipsec tunnel summary\nReview VPN Events and configured VPN mode", "refs": [1, 4]}, {"k": "routing", "id": "LS-15", "name": "Routing and SD-WAN state", "scope": "FortiGate", "source": "Event logs; operational state", "facility": "type=event; router / sdwan", "events": "Routing and SD-WAN state", "fields": "interface, action, status, msg; health-check fields if emitted", "condition": "Requires configured routing/SD-WAN and event selection. Syslog is not a full route-update stream or continuous latency metric source.", "verify": "get router info routing-table all\nReview Router and SD-WAN events", "refs": [1, 4]}, {"k": "health", "id": "LS-16", "name": "System, HA and log transport health", "scope": "FortiGate", "source": "Event logs; telemetry; receiver health", "facility": "type=event; system / ha", "events": "System, HA and log transport health", "fields": "devid, devname, vd, action, status, msg; component metrics where present", "condition": "Track each HA member serial, role changes, resource alarms and log target connectivity. Counters/polling are needed to distinguish a quiet source from failed collection.", "verify": "get system status\nget system ha status\nshow log syslogd setting", "refs": [1, 2, 4]}, {"k": "fssoevent", "id": "LS-17", "name": "FortiGate FSSO user and server events", "scope": "FSSO", "source": "FortiGate user-event syslog", "facility": "type=event; subtype=user; FSSO-specific message IDs", "events": "FortiGate FSSO user and server events", "fields": "logid, user, group, srcip, server, action, status, msg", "condition": "This is firewall-side FSSO evidence, not the collector debug file. Not all FSSO variants emit the same events. Documented message ID 43051 means FSSO server disconnected; retain full logid as a string.", "verify": "diagnose debug authd fsso server-status\ndiagnose debug authd fsso list\ndiagnose firewall auth list", "refs": [5, 6, 7]}, {"k": "fssoagent", "id": "LS-18", "name": "Collector Agent application and connection log", "scope": "FSSO", "source": "Windows Collector Agent local log file; agent/UF collection", "facility": "FSSO Collector Agent application log", "events": "Collector Agent application and connection log", "fields": "collector_host, timestamp, severity, peer, message (format-dependent)", "condition": "Use View Log to locate/export the actual file; paths and filenames depend on installation/version. FortiGate syslog does not automatically include this Windows file. Keep verbose debug bounded.", "verify": "Collector Agent console > View Log; inspect actual logging path and retention", "refs": [8, 9]}, {"k": "fssologon", "id": "LS-19", "name": "Collector Agent logon/logoff mapping evidence", "scope": "FSSO", "source": "Collector Agent logon-event / debug files", "facility": "LOGON_ITEM / UPDATE_LOGON_LIST / SEND_EVENT_TO_FGT markers", "events": "Collector Agent logon/logoff mapping evidence", "fields": "user, domain, ip, workstation, logon, FortiGate_SN", "condition": "These markers belong to diagnostic records; availability depends on logging mode. Logon=1 adds a mapping and logon=0 removes it in documented examples. A removal can be timeout/IP-change driven, not a literal Windows logoff.", "verify": "Collector Agent > View Logon Events; compare Show Logon Users with FortiGate mapping table", "refs": [8, 9]}, {"k": "dc", "id": "LS-20", "name": "Windows DC and identity-provider evidence", "scope": "FSSO", "source": "Windows Security channel via approved UF/WEF or equivalent", "facility": "Windows 4624, 4768, 4769, 4776 as relevant to method", "events": "Windows DC and identity-provider evidence", "fields": "EventCode, Computer, TargetUserName, TargetDomainName, IpAddress, WorkstationName, LogonType, time", "condition": "Supporting evidence, not a claim that every FSSO collection mode consumes every event ID. DC Agent, WMI/WinSec polling and direct FortiGate polling have different requirements. Logon IDs do not join across hosts universally.", "verify": "Validate DC audit settings and the exact FSSO polling/agent mode", "refs": [5, 10]}, {"k": "fssohealth", "id": "LS-21", "name": "Mapping health, group filters and workstation checks", "scope": "FSSO", "source": "Collector logs; mapping snapshots; DNS/DHCP evidence", "facility": "FSSO diagnostic and state data", "events": "Mapping health, group filters and workstation checks", "fields": "user, ip, workstation, group, last_seen, collector_host", "condition": "Stale IP mappings, unavailable workstation verification, group filters and DNS changes can explain missing identity. Snapshot fields are derived operational state, not guaranteed syslog fields.", "verify": "Compare Collector Agent users, group filters and workstation verification with FortiGate FSSO list", "refs": [6, 9, 10]}, {"k": "tsagent", "id": "LS-22", "name": "Terminal Server / Citrix identity mapping", "scope": "FSSO", "source": "TS Agent local diagnostics; Collector Agent; firewall mappings", "facility": "Agent-specific diagnostic format", "events": "Terminal Server / Citrix identity mapping", "fields": "user, server_ip, source_port_range, timestamp", "condition": "Optional TS Agent deployment. Multiple users share an IP; a source port/range and time can be required. Plain user-to-IP correlation is insufficient for terminal servers or NAT/shared endpoints.", "verify": "Verify TS Agent version, port allocation and supported collection method", "refs": [5, 10]}, {"k": "fmgadmin", "id": "LS-23", "name": "FortiManager administrator and API audit", "scope": "FortiManager", "source": "FortiManager local event logs > syslog", "facility": "Native log_id / type / subtype; administrator events", "events": "FortiManager administrator and API audit", "fields": "user, user_from, ui, operation, status, msg, adom (when present)", "condition": "FortiManager log_id differs from FortiGate logid. Correlate management API identities to automation ownership. Do not assume every API payload is exported.", "verify": "Review System Settings > Event Log and administrator/API accounts", "refs": [11, 12, 13]}, {"k": "fmgobjects", "id": "LS-24", "name": "ADOM, policy and object changes", "scope": "FortiManager", "source": "Local event logs; revision / workspace history", "facility": "Object and policy audit; subtype varies", "events": "ADOM, policy and object changes", "fields": "adom, user, operation, performed_on, changes, msg", "condition": "Saving an object or committing a workspace change modifies manager state; it does not establish a successful device install. Preserve ADOM and policy-package context.", "verify": "Review Event Log, ADOM/workspace history and policy package revisions", "refs": [11, 12, 14]}, {"k": "fmginstall", "id": "LS-25", "name": "Policy and device configuration installation", "scope": "FortiManager", "source": "Local events plus Task Monitor / installation log / API export", "facility": "Install task summary and detailed task artifacts", "events": "Policy and device configuration installation", "fields": "task_id, device_serial, adom, package, actor, result (normalized where needed)", "condition": "Full per-device CLI/install transcript is not guaranteed in forwarded local syslog. Retrieve task/install detail separately and retain task ID, target and revision where available.", "verify": "Review Task Monitor, Install Wizard result, Revision History and installation log", "refs": [14]}, {"k": "fmgdevice", "id": "LS-26", "name": "Device registration, FGFM and synchronization", "scope": "FortiManager", "source": "FortiManager local events; Device Manager state", "facility": "fgfm / device-manager event families", "events": "Device registration, FGFM and synchronization", "fields": "device_serial, device_name, adom, status, operation, msg", "condition": "The FGFM management channel is separate from log transport. Connected status does not prove policies are synchronized or traffic logs are reaching the SIEM.", "verify": "Review Device Manager status and Event Log; compare intended/installed configuration", "refs": [11, 12, 13]}, {"k": "fmgscript", "id": "LS-27", "name": "Scripts, automation and provisioning", "scope": "FortiManager", "source": "Event audit; task/script results", "facility": "Script/task audit; format depends on source", "events": "Scripts, automation and provisioning", "fields": "user, adom, target, task_id, script_name, status, result", "condition": "Manager-side script execution and remote device results require task detail. Keep script contents/output separate if they contain secrets; do not assume complete output is in syslog.", "verify": "Review script/task execution history and per-device results", "refs": [12, 14]}, {"k": "fmghealth", "id": "LS-28", "name": "FortiManager system, HA and collection health", "scope": "FortiManager", "source": "Local event logs > syslog; monitoring", "facility": "System / HA / service events", "events": "FortiManager system, HA and collection health", "fields": "log_id, pri, device_id, msg, status, component", "condition": "Monitor manager resource health, HA and external-log connectivity. Retain source manager identity; local appliance audit is not the full managed-firewall traffic stream.", "verify": "get system status\nget system syslog\nget system locallog syslogd setting", "refs": [11, 12, 13]}, {"k": "fmgdiag", "id": "LS-29", "name": "FortiManager diagnostic and support artifacts", "scope": "FortiManager", "source": "Bounded CLI debug; support files; task exports", "facility": "On-demand diagnostics, not baseline syslog", "events": "FortiManager diagnostic and support artifacts", "fields": "timestamp, process, task_id, target, message", "condition": "Use diagnostics only for a scoped investigation. Do not enable indefinite broad debugging or assume debug output is forwarded as a local event.", "verify": "Use a release-specific support procedure; finish with diagnose debug disable and diagnose debug reset", "refs": [11, 14]}, {"k": "userauth", "id": "LS-30", "name": "Firewall user authentication and SAML/AAA outcomes", "scope": "FortiGate", "source": "User-event syslog plus external AAA / IdP logs", "facility": "type=event; subtype=user", "events": "Firewall user authentication and SAML/AAA outcomes", "fields": "user, srcip, authproto, action, status, reason, group", "condition": "Ordinary authentication events are not automatically FSSO events. SAML administrator/VPN SSO is separate from passive FSSO; add IdP and VPN/admin audit for that path.", "verify": "Review User Events and correlate with RADIUS/LDAP/IdP evidence", "refs": [4, 5]}];
const DETS=[{"id": "D01", "title": "Management brute force and unusual success", "level": "high", "keys": ["admin", "fmgadmin"], "logic": "Count explicit failures per appliance/source/account in 5 minutes; start at 10 and tune. Correlate a later successful login from the same source.", "context": "Separate administrator authentication from end-user/FSSO mappings. A mapping is not evidence of a management login."}, {"id": "D02", "title": "Unexpected administrator or API change", "level": "high", "keys": ["config", "fmgadmin", "fmgobjects"], "logic": "Detect new privileged accounts, API access, trusted-host changes or changed administrator roles; correlate actor with approved change.", "context": "Validate effective configuration and API account owner; changes may be legitimate automation."}, {"id": "D03", "title": "Policy broadening or protection removal", "level": "critical", "keys": ["config", "fmgobjects", "fmginstall", "forward"], "logic": "Find broadened addresses/services, disabled profiles or changed identity groups; confirm successful install and subsequent effective policy.", "context": "A FortiManager edit without installation does not prove the firewall changed."}, {"id": "D04", "title": "Logging disabled or collection gap", "level": "high", "keys": ["config", "health", "fmgobjects", "fmghealth", "fssoagent"], "logic": "Detect log destination/filter changes, collector service interruption or last-seen gaps against expected inventory.", "context": "Use receiver health and reachability to distinguish source silence from outage. Quiet systems need an approved heartbeat or polling."}, {"id": "D05", "title": "Denied traffic sweep or exposed management probe", "level": "medium", "keys": ["deny", "local", "forward"], "logic": "Aggregate denied flows by source and count distinct destination ports/hosts; compare against scanner allowlists.", "context": "Initial threshold: 20 destination ports per source in 5 minutes. Threshold and topology require tuning."}, {"id": "D06", "title": "Possible exploit with allowed follow-on traffic", "level": "high", "keys": ["ips", "forward"], "logic": "Correlate IPS attack events and actual action with subsequent traffic on device/VDOM/session/time.", "context": "An IPS signature or pass action alone does not prove compromise. Verify direction and signature context."}, {"id": "D07", "title": "Malware detection and recurring destination", "level": "high", "keys": ["av", "web", "dns", "forward"], "logic": "Join malware detection, DNS/web destination and session outcomes; prioritize repeat attempts after blocking.", "context": "Detection-only actions and unavailable TLS visibility must be explicit; confirm endpoint evidence."}, {"id": "D08", "title": "Suspicious DNS or web destination", "level": "high", "keys": ["dns", "web", "forward"], "logic": "Find blocked malicious categories or rare destinations by source/user; corroborate resolution and traffic.", "context": "Domain category changes, shared hosting and secure DNS can complicate interpretation."}, {"id": "D09", "title": "Prohibited application or potential data movement", "level": "high", "keys": ["app", "dlp", "forward"], "logic": "Correlate application/DLP action with bytes and destination; investigate unusual outbound volume.", "context": "Bytes may be cumulative across interim/end logs. Do not label exfiltration from a blocked DLP event alone."}, {"id": "D10", "title": "VPN login and tunnel anomaly", "level": "high", "keys": ["vpn", "forward", "admin"], "logic": "Find repeated explicit VPN authentication failures or a new remote source followed by tunnel establishment and unusual traffic.", "context": "Identity-provider MFA events and endpoint posture are separate sources. VPN mode support varies by release."}, {"id": "D11", "title": "FSSO Collector disconnected or unavailable", "level": "high", "keys": ["fssoevent", "fssoagent", "health"], "logic": "Alert on documented FSSO disconnect events and prolonged collector unavailability; check mapping freshness and policy impact.", "context": "A collector disconnection can leave existing mappings temporarily cached; measure actual impact."}, {"id": "D12", "title": "Stale or conflicting FSSO identity", "level": "high", "keys": ["fssologon", "fssohealth", "dc", "forward"], "logic": "Compare mapping add/remove/IP-change time with DC logon, DNS/DHCP and traffic; flag conflicting users for the same endpoint/time.", "context": "Shared hosts and TS Agent need port-range context; source IP by itself is weak identity evidence."}, {"id": "D13", "title": "Unexpected FSSO group or mapping expansion", "level": "high", "keys": ["fssohealth", "config", "fmgobjects", "forward"], "logic": "Detect changes to allowed groups/filters and unusual mapped identities receiving access; validate actual matched policy.", "context": "Group membership and filter configuration changes may need AD audit and configuration diffs outside baseline FSSO logs."}, {"id": "D14", "title": "FortiManager install failure or partial rollout", "level": "high", "keys": ["fmginstall", "fmgobjects", "fmgdevice"], "logic": "Track each target in an install task; alert on failure, skipped targets or revisions remaining out of sync.", "context": "An overall task summary can hide per-device outcomes. Preserve detailed task results."}, {"id": "D15", "title": "Unauthorized central script execution", "level": "critical", "keys": ["fmgscript", "fmgadmin", "config"], "logic": "Compare script initiator, target set and schedule against approved automation, then inspect device result.", "context": "Task start is not task success; correlate output and changes. Restrict access to sensitive scripts."}, {"id": "D16", "title": "Unexpected managed device or FGFM loss", "level": "high", "keys": ["fmgdevice", "fmgadmin", "health"], "logic": "Compare device registration/authorization and disconnection events to serial/ADOM inventory.", "context": "FGFM connection is management reachability, not assurance of syslog delivery else if(Object.keys(f).some(k=>['logid','log_id','type','subtype'].includes(k)))f.format='Fortinet key=value fields';
if(f.log_id&&!f.date){let d=s.match(/(?:^|>)(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})/);if(d){f.date=d[1];f.time=d[2]}}

if(f.type==='utm'){let key={ips:'ips',virus:'av',webfilter:'web',dns:'dns','app-ctrl':'app',dlp:'dlp','file-filter':'dlp',emailfilter:'dlp',ssl:'ssl',waf:'ssl',anomaly:'anomaly'}[f.subtype];if(key)k.push(key)}if(f.type==='anomaly')k.push('anomaly');

spec:()=>`<h1>Log specification</h1><p class="lede">Filter by evidence source. The FSSO view includes firewall-side FSSO events as well as Windows agent evidence; it is not a separate appliance for every row.</p>${controls()}`,
components:()=>`<h1>Components and sources</h1>${table(['Component','Baseline','Conditional / separate'],[['FortiGate / FortiOS','Administrator, change, system, HA, user and required traffic logs','UTM inspection, VPN, SD-WAN, local traffic and implicit denies depend on settings'],['FSSO Collector Agent','Health/connection evidence and mapping-state validation','Logon diagnostics and debug files need explicit local collection and bounded retention'],['DC Agent / polling / direct polling','Verify exact collection mode and monitored DCs','Mode-specific Windows events, permissions, latency and logoff behaviour'],['TS Agent','User-to-port mapping where deployed','Required for appropriate shared-host scenarios; ordinary IP joins are insufficient'],['FortiAuthenticator (optional)','FSSO service and authentication evidence if used','Its own logs and collection configuration; not assumed to be Windows Collector Agent logs'],['FortiManager','Local administrator/change/system/FGFM audit','Task, install and revision details can require a separate export/API collector'],['FortiAnalyzer (optional)','Log reception/forwarding health where deployed','Not automatically present merely because FortiManager manages devices']].map(r=>r.map(esc)))}<h2>Inventory dimensions</h2><p>Record FortiGate serial and VDOM, cluster members, FortiOS version, manager/ADOM ownership, policy-package assignment, Collector/TS Agent version, collection mode, monitored DCs and expected log destinations. A source is only covered when both generation and end-to-end arrival have been demonstrated.</p>`,
formats:()=>`<h1>Formats and identifiers</h1>${code('FortiGate native body (simplified)','date=YYYY-MM-DD time=hh:mm:ss tz="+1100" devid="..." logid="0000000013" type="traffic" subtype="forward" level="notice" vd="root" ...')}${code('FortiManager native body (simplified)','YYYY-MM-DD hh:mm:ss tz="+1100" log_id=... type=event subtype=... pri=... user="..." operation="..." msg="..."')}${code('FSSO diagnostic body (illustrative)','[LOGON_ITEM] logon:1 ip:192.0.2.20 workstation:CLIENT01 domain:EXAMPLE user:alice')}<p>Native key=value, CEF, CSV, JSON and RFC5424 are not interchangeable parser inputs. Choose a supported format and preserve the original envelope/body. The interactive triage supports selected native key=value and FSSO diagnostic records only.</p><h2>Identifier and timestamp rules</h2><ul class="plain"><li>Keep FortiGate <code>logid</code> and FortiManager <code>log_id</code> as strings. A catalogue message ID is not always the full transmitted identifier.</li><li>Keep 64-bit <code>eventtime</code> text intact. Select units from the product/version schema; older records may use seconds, while other releases emit nanoseconds.</li><li>Use <code>date</code>, <code>time</code> and <code>tz</code> together when parsing device-local time. Keep receiver time separately.</li><li>Scope session IDs by firewall serial, VDOM and time; scope policy IDs similarly. No universal correlation ID joins AD, FSSO, traffic and FortiManager.</li></ul><h2>Severity</h2>${table(['Numeric priority level','Common label'],['emergency','alert','critical','error','warning','notice / notification','information / info','debug'].map((s,i)=>[String(i),esc(s)]))}<p>Preserve native severity spelling and the syslog PRI separately. A destination threshold can discard low-severity audit or traffic records. Detection priority, IPS severity and application risk are different dimensions.</p>`,
detections:()=>`<h1>Detection catalogue</h1><p class="lede">${DETS.length} proposed analytics. Field mapping, thresholds and benign exclusions require validation.</p>${table(['ID','Use case','Priority','Evidence'],DETS.map(d=>[dlink(d),`<a href="#det-${d.id}">${esc(d.title)}</a>`,`<span class="lvl ${d.level}">${d.level}</span>`,d.keys.map(k=>link(LOGS.find(l=>l.k===k))).join('<br>')]))}`,
hunt:()=>`<h1>Hunt explorer</h1><p class="lede">Select an analytic to inspect its collection dependencies and evidence limits.</p><label>Use case <select id="huntSelect" class="btn">${DETS.map(d=>`<option value="${d.id}">${d.id} · ${esc(d.title)}</option>`).join('')}</select></label><div id="huntResult"></div>`,
triage:()=>`<h1>Triage a log line</h1><p class="lede">Local-only sample parser. Paste one native Fortinet record; input is not transmitted.</p>${note('Matches identify candidate evidence categories, not incidents. Source product must be confirmed from the input configuration; field-name heuristics alone are not authoritative. CEF/JSON/CSV require their own parser.')}<label for="tin">Raw event</label><textarea id="tin" spellcheck="false"></textarea><div class="row"><button class="btn pri" id="parse">Inspect event</button>${SAMPLES.map((s,i)=>`<button class="btn sm" data-example="${i}">${s.name}</button>`).join('')}</div><p class="sub">All examples are synthetic. The configuration-change example intentionally omits a logid rather than inventing one.</p><div id="result" aria-live="polite"></div>`,
correlation:()=>`<h1>Identity and policy correlation</h1><p class="lede">Two linked investigations: who was mapped to the traffic, and which configuration was actually installed?</p><h2>1. User → FSSO mapping → firewall traffic</h2>${table(['Step','Evidence','Join and limitation'],[['Directory authentication','DC / AAA event with user and source context','Account/domain + host/IP + bounded time; DC events may not name the application'],['Collector mapping','LOGON_ITEM add/remove or equivalent source records','User + domain + workstation/IP + observed mapping interval'],['Delivery / firewall state','Collector target firewall and FSSO mapping snapshot','Firewall serial/VDOM + mapping IP; delivery does not prove packet authorization'],['Traffic decision','Traffic record with user, addresses, policy, session and action','Serial + VDOM + time + source IP/port; do not impute a user when absent'],['Security outcome','UTM record and corresponding traffic','Session + device + VDOM + bounded time; inspect action and direction']].map(r=>r.map(esc)))}${note('Mapping removals can follow timeout, workstation checks or IP changes. Do not equate them automatically with a Windows logoff. NAT, shared endpoints and terminal servers may require additional port, DHCP and endpoint evidence.')}<h2>2. Manager change → install → effective firewall policy</h2>${table(['Stage','Evidence','Test'],[['Edit','Manager actor, ADOM, policy package/object and revision','Was this authorized? What changed?'],['Install request','Task identity, initiator and target device set','Was this package targeted at the expected serial/VDOM?'],['Per-device result','Installation log / Task Monitor / revision history','Succeeded, failed, skipped or partial?'],['Effective state','Firewall configuration and manager synchronization state','Does installed configuration match intended revision?'],['Observed enforcement','Traffic/UTM policyid or poluuid with action','Did the expected policy govern the session?']].map(r=>r.map(esc)))}<h2>Correlation confidence</h2><p><strong>Strong:</strong> native task/revision or session identifiers within their correct scope. <strong>Supporting:</strong> device/VDOM, identity, source and narrow time agreement. <strong>Weak:</strong> source IP alone, username without domain, or approximate timestamps without synchronized clocks. Retain the basis of each inferred relationship.</p>`,
enable:()=>`<h1>Enable logging</h1><p class="lede">Three distinct configuration surfaces. Merge reviewed changes into your deployed versions; do not overwrite existing destinations or policy settings.</p><h2>FortiGate baseline</h2>${code('Illustrative native key=value syslog baseline',FGTCONFIG)}<p>The UDP example is a transport baseline, not an encrypted path. For supported reliable/TLS logging, configure the matching collector listener, <code>mode reliable</code>, TLS options and certificate trust using the exact firmware reference. A reliable TCP mode by itself is not TLS. Validate framing and loss behaviour.</p>${code('Policy traffic generation',POLICY)}<p>Also review security-profile logging, local traffic generation, implicit denies and each VDOM/global override. Export filters cannot recover events that were never generated. Debug-level inclusion is normally a scoped troubleshooting choice.</p><h2>FSSO Collector Agent and supporting Windows sources</h2><ol class="plain"><li>Record collection mode, Collector/DC/TS Agent versions, monitored DCs, group filters and connected FortiGates.</li><li>Use <strong>View Log</strong> and <strong>View Logon Events</strong> to locate actual files. Confirm retention, rollover and encoding.</li><li>Configure an approved Windows file collector for these paths. Assign separate source classifications for application and logon/debug records; do not assume a fixed install path.</li><li>Collect required DC Security and agent service health evidence separately. Match audit settings to the selected FSSO mode.</li><li>Temporarily raise diagnostics for an approved test if needed, then restore the normal level and validate mapping removal/freshness.</li></ol>${code('Read-only FortiGate FSSO state inspection','diagnose debug authd fsso server-status\ndiagnose debug authd fsso list\ndiagnose firewall auth list')}<h2>FortiManager local-event syslog</h2>${code('Destination definition and local audit forwarding',FMGCONFIG)}<p>Review the deployed FortiManager syslog server options for reliable/TLS transport, peer certificate validation and port. Verify local-log category filters include required administrator, configuration, FGFM and system evidence. Do not copy FortiGate <code>config log syslogd</code> syntax to FortiManager.</p><h2>Acceptance tests</h2>${table(['Source','Controlled test','Required evidence'],[['FortiGate','Test traffic through a selected policy plus a benign administrator action','Correct device/VDOM, timestamp, action and policy; expected remote destination'],['FSSO','Approved test user logon and mapping removal','Collector observation, firewall mapping, traffic identity and explicit removal reason where available'],['FortiManager','Approved benign edit and test install in a lab','Actor/ADOM/revision, per-target task result and confirmed device configuration'],['All sources','Collector restart and expected source health check','Loss/delay documented; last-seen checks compared with inventory']].map(r=>r.map(esc)))}`,
parsing:()=>`<h1>SIEM parsing</h1><p class="lede">Splunk-oriented source separation and search examples. Sourcetype names below are proposed custom names; use your installed add-on conventions where applicable.</p>${table(['Source','Example sourcetype','Parsing contract'],[['FortiGate native syslog','fortinet:fortigate:syslog','Quoted key=value, native logid, type/subtype and device/VDOM'],['FSSO application file','fortinet:fsso:collector','Agent-specific time/level/message; multiline handling based on captured records'],['FSSO logon diagnostic file','fortinet:fsso:logon','Marker-specific key:value extraction; preserve collector identity'],['FortiManager local audit','fortinet:fortimanager:event','Native log_id, pri, actor and source-specific fields'],['FortiManager task export','fortinet:fortimanager:task','Versioned API/export schema; normalize task, targets, result and revision'],['Windows DC Security','Existing approved Windows sourcetype','Native event XML/schema; no reinterpretation as FortiGate logs']].map(r=>r.map(esc)))}${code('Forward traffic overview — assumes validated field extraction',String.raw`index=network sourcetype="fortinet:fortigate:syslog" type=traffic subtype=forward
| stats count values(action) as actions values(user) as users by devid vd policyid
# count is log records, not necessarily unique sessions.`)}${code('FSSO disconnected — validate ID for the deployed FortiOS release',String.raw`index=network sourcetype="fortinet:fortigate:syslog" logid="0102043051"
| table _time devid vd server logdesc msg`)}${code('Collector mapping example — extraction scoped to LOGON_ITEM',String.raw`index=identity sourcetype="fortinet:fsso:logon" "[LOGON_ITEM]"
| rex field=_raw "logon:(?<mapping_action>[01])"
| rex field=_raw "ip:(?<mapping_ip>\S+)"
| rex field=_raw "domain:(?<domain>\S+)"
| rex field=_raw "user:(?<user>\S+)"
| table _time host mapping_action mapping_ip domain user`)}<h2>Normalize without losing source semantics</h2><p>Keep <code>logid</code> and <code>log_id</code> intact and add a normalized event identifier separately. Preserve user domain, IPv6, quotes, backslashes, VDOM and serial. Derive outcome only from the event-specific action/status mapping. Do not sum interim/start/end session byte counters indiscriminately.</p>${note('Do not split records on spaces: quoted values contain spaces and escaped characters. Preserve raw eventtime as a string through JSON/JavaScript processing; timestamp conversion must use the correct documented units.')}<h2>Parser acceptance fixtures</h2><p>Test quoted whitespace, escaped quotes/backslashes, leading-zero IDs, 64-bit eventtime, IPv6, absent user, HA member changes, VDOM overrides, relay headers, partial task failure and FSSO mapping removal. Use a separate parser for CEF or other export formats.</p>`,
hardening:()=>`<h1>Hardening and operations</h1>${table(['Area','Operational requirement'],[['Administrative control','Separate identities, least privilege, approved API ownership and centralized change approval.'],['Identity integrity','Monitor Collector service health, group filters and mapping freshness; correlate DNS/DHCP and shared hosts.'],['Management changes','Retain manager revisions and per-device install results; alert on unexpected local firewall edits.'],['Log transport','Restrict source/listener paths, use supported authenticated encryption, monitor queue/drop/reconnect conditions.'],['Retention and privacy','Protect administrator commands, user mappings, URLs and task output; define retention and access based on evidence needs.'],['Diagnostics','Bound debug duration and size; restore normal logging after tests.'],['Coverage review','Re-test after FortiOS/FortiManager/agent upgrades, VDOM changes and profile or policy modifications.'],['Availability','Compare received source inventory with expected serials, VDOMs, agents and manager instances; validate failover behaviour.']].map(r=>r.map(esc)))}`,
about:()=>`<h1>About and sources</h1><p class="lede">FortiGate, FSSO and FortiManager log specification · Version 1 · 10 November 2026.</p><p>This is a collection and detection design reference, not an exhaustive firmware-specific list of all Fortinet message IDs. Coverage depends on licensed/enabled features, version, VDOM, inspection and policy settings. Source references span several versions; select the exact deployed release before implementation.</p><p>All sample records are synthetic. Some examples deliberately omit identifiers rather than asserting an unverified message ID. The page works offline; reference links require internet access. No input is sent to a server.</p><h2>Primary references</h2>${SOURCES.map(([t,u],i)=>`<p>[${i+1}] <a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></p>`).join('')}<h2>Scope notes</h2><p>FSSO agent and FortiAuthenticator evidence are deployment alternatives, not interchangeable file formats. FortiManager local audit is separate from firewall traffic and from detailed task artifacts. Generic detections and SIEM names are proposed examples, not vendor-supplied rules.</p>`
};
function render(){const h=location.hash.slice(1)||'overview';let body,title;
if(h.startsWith('spec-')){let l=LOGS.find(l=>l.k===h.slice(5));body=l?specDetail(l):PAGES.spec();title=l?.name||'Specification';}
else if(h.startsWith('det-')){let d=DETS.find(d=>d.id===h.slice(4));body=d?detection(d):PAGES.detections();title=d?.title||'Detections';}
else if(h.startsWith('schemas')){body=schema(h.slice(8));title='Schema explorer';}
else{body=(PAGES[h]||PAGES.overview)();title=NAV.flatMap(g=>g[1]).find(i=>i[0]===h)?.[1]||'Overview';}
$('#main').innerHTML=`<div class="page">${body}</div>`;document.title=title+' · Fortinet Log Specification';document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',h===a.dataset.nav||h.startsWith(a.dataset.nav+'-')||a.dataset.nav==='detections'&&h.startsWith('det-')?'page':'false'));
if($('#rows')){specRows();$('#scope').onchange=e=>{filterScope=e.target.value;specRows()};$('#filter').oninput=e=>{filterText=e.target.value;specRows()};$('#export').onclick=exportCSV;}
if($('#huntSelect')){const update=()=>{const d=DETS.find(x=>x.id===$('#huntSelect').value);$('#huntResult').innerHTML=`<h2>${esc(d.title)}</h2><p>${esc(d.logic)}</p>${table(['Evidence','Collection','Limit'],d.keys.map(k=>{let l=LOGS.find(l=>l.k===k);return[link(l),esc(l.source),esc(l.condition)]}))}`};$('#huntSelect').onchange=update;update();}
if($('#parse'))$('#parse').onclick=triage;
closeMenu();scrollTo(0,0);$('#main').focus({preventScroll:true});}
function triage(){const s=$('#tin').value.trim();if(!s){$('#result').innerHTML=note('Paste an event or select a sample.');return}if(s.split('\n').length>1){$('#result').innerHTML=note('Please inspect one event at a time.');return}const f=parse(s),ks=matches(s);$('#result').innerHTML='<h2>Extracted fields</h2>'+(!f.format?note('Unrecognized record format. Any fields below are partial matches; validate the source format.'):'')+table(['Field','Value'],Object.entries(f).map(r=>r.map(esc)))+'<h2>Candidate evidence categories</h2>'+(ks.length?ks.map(k=>`<p>${link(LOGS.find(l=>l.k===k))}</p>`).join(''):'<p>No category match. This does not mean the event is harmless or invalid.</p>')+note('No incident verdict is produced. Use the detection catalogue with baselines, counts and corroborating evidence.');}
function exportCSV(){const keys=['id','name','scope','source','facility','fields','condition','verify','refs'];const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const text=[keys,...filtered().map(l=>keys.map(k=>l[k]))].map(r=>r.map(quote).join(',')).join('\r\n');const u=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download='fortinet-log-specification.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}
$('#side').innerHTML=NAV.map(([t,a])=>`<h5>${t}</h5>${a.map(([k,n])=>`<a href="#${k}" data-nav="${k}">${n}</a>`).join('')}`).join('')+'<p class="poc">Implementation reference. Validate against your product versions.</p>';
function closeMenu(){$('#side').classList.remove('open');$('#scrim').hidden=true;$('#menu').setAttribute('aria-expanded','false');}
$('#menu').onclick=()=>{let on=$('#side').classList.toggle('open');$('#scrim').hidden=!on;$('#menu').setAttribute('aria-expanded',String(on))};$('#scrim').onclick=closeMenu;
function themeLabel(){$('#theme').textContent=document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode'}
try{document.documentElement.dataset.theme=localStorage.getItem('fortinet-spec-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}themeLabel();$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('fortinet-spec-theme',t)}catch(e){}themeLabel()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(b){const pre=b.closest('.block').querySelector('pre');try{await navigator.clipboard.writeText(pre.textContent);b.textContent='Copied'}catch(e){let r=document.createRange();r.selectNodeContents(pre);let s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected'}setTimeout(()=>b.textContent='Copy',1500)}const ex=e.target.closest('[data-example]');if(ex){$('#tin').value=SAMPLES[+ex.dataset.example].raw;triage();}if(!e.target.closest('.srch')){$('#sres').hidden=true;$('#q').setAttribute('aria-expanded','false')}});
let searchIndex=-1;
$('#q').oninput=()=>{const v=$('#q').value.toLowerCase().trim(),terms=v.split(/\s+/);const all=[...NAV.flatMap(g=>g[1].map(([k,t])=>({h:k,t,x:t}))),...LOGS.map(l=>({h:'spec-'+l.k,t:l.id+' · '+l.name,x:JSON.stringify(l)})),...DETS.map(d=>({h:'det-'+d.id,t:d.id+' · '+d.title,x:JSON.stringify(d)}))];const found=all.filter(i=>terms.every(t=>i.x.toLowerCase().includes(t))).slice(0,14);$('#sres').innerHTML=found.length?found.map(i=>`<a role="option" href="#${i.h}">${esc(i.t)}</a>`).join(''):'<div class="none">No matches.</div>';$('#sres').hidden=!v;$('#q').setAttribute('aria-expanded',String(!!v));searchIndex=-1;};
$('#q').onkeydown=e=>{const a=[...$('#sres').querySelectorAll('a')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(a.length){searchIndex=(searchIndex+(e.key==='ArrowDown'?1:-1)+a.length)%a.length;a.forEach((v,i)=>v.classList.toggle('on',i===searchIndex));a[searchIndex].scrollIntoView({block:'nearest'})}}if(e.key==='Enter'&&a.length){e.preventDefault();a[Math.max(0,searchIndex)].click()}};
$('#sres').onclick=()=>{$('#sres').hidden=true;$('#q').value='';$('#q').setAttribute('aria-expanded','false')};
addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenu();$('#sres').hidden=true;$('#q').setAttribute('aria-expanded','false')}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
addEventListener('hashchange',render);render();

</script>
</body></html>
